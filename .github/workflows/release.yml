name: Release

# 推送 v* 标签时触发：构建 Windows 安装包并发布到 GitHub Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        # v5 起内部运行时为 Node 24，符合 GitHub 2026 起的强制要求
        uses: actions/checkout@v5

      - name: Setup Node.js
        # v5 起内部运行时为 Node 24；构建用的 Node 版本仍由 node-version 指定
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & publish to GitHub Release
        env:
          # GH_TOKEN 是 electron-builder 上传 Release 所需，使用 Actions 自带的 GITHUB_TOKEN
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
