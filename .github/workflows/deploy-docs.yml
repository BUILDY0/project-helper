name: Deploy Docs

# 与 release.yml 触发条件保持一致：推送 v* 标签时触发
# 构建 VitePress 文档并发布到 GitHub Pages
on:
  push:
    tags:
      - "v*"
  # 支持在 GitHub Actions 页面手动触发，便于首次部署或临时重建
  workflow_dispatch:

# Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个 Pages 部署在跑（新跑的会取消进行中的旧任务，避免覆盖竞争）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # VitePress lastUpdated 需要完整 git 历史
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 自动启用仓库 Pages 并把 Source 配为 GitHub Actions，
          # 避免首次部署时报 "Get Pages site failed" 错误
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
